[project]
name = "val-replay-analyzer"
version = "0.1.0"
description = "Decode and replay Valorant .vrf replay files."
readme = "README.md"
requires-python = ">=3.11"
# The decoding pipeline is stdlib + tkinter and stays that way; the desktop
# app is not.  customtkinter is the widget set the brief specifies, and Pillow
# is what draws a circular portrait and scales a minimap tile by a fraction --
# Tk's own subsample divides by whole numbers only.  python-dotenv is
# deliberately NOT here: libraries/envfile.py already implements the exact
# contract vrfconfig needs, so adding it would have meant two readers of one
# .env in one process.  vrfconfig.py says so at greater length.
dependencies = [
    "customtkinter>=6.0.0",
    "Pillow>=11.0.0",
]

# The two library modules carry a CLI as well; scripts/ holds the pure CLIs,
# which runners/ invokes by path.
[project.scripts]
vrf-reader = "vrf_reader:main"
vrf-to-json = "vrf_to_json:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# libraries/ is the source root, not a package: its contents (two loose modules
# and two packages) map onto the install root, so `import vrf_reader` and
# `import vrfnet` keep working from anywhere.
only-include = ["libraries"]
sources = ["libraries"]

[tool.pytest.ini_options]
# scripts/ is not installed by the wheel -- only libraries/ is -- so the CLIs
# are unimportable from a test without this. tests/ itself is reached via the
# rootdir, which pytest adds because tests/ is a package.
pythonpath = ["scripts"]

[tool.uv]
package = true
