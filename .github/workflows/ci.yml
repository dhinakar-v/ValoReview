# What every push has to survive.
#
# Windows only, because every runner in this repository is a .bat and the one
# thing CI must not do is prove a different tree works.
#
# It runs without `Demos/` and without `assets/`, which is what the test suite
# is built for: everything needing the reference library is `skipUnless(...)`,
# and `tests/golden/` is committed precisely so the two model ports can be
# compared with no capture at all. So this proves the code, not the machine's
# replay folder -- and a green run here still leaves `tests/test_positions.py`,
# the ground truth, as something only a machine with captures can answer.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  decoder:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # No clone step and no patch step: the parser is vendored at
      # csharp/parser, which is the whole reason this job is three lines.
      - run: dotnet build csharp/VrfPositions/VrfPositions.csproj -c Release
